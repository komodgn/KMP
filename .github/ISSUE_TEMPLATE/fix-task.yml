name: "🐛 Bug Fix"
description: "Report a bug or submit a fix task."
title: "[Fix] "
labels: ["bug", "fix"]
body:
    - type: input
      id: issue_summary
      attributes:
          label: "📝 Issue Summary"
          description: "A clear and concise description of what the bug is."
      validations:
          required: true

    - type: textarea
      id: ui_comparison
      attributes:
          label: "🎨 UI Comparison (Optional)"
          description: "If this is a UI fix, please provide before/after screenshots."
          value: |
              | Before | After |
              | :---: | :---: |
              | <img src="" width="180" /> | <img src="" width="180" /> |
      validations:
          required: false

    - type: textarea
      id: context
      attributes:
          label: "🔗 Context & Resources"
          description: "Add any relevant links, logs, or environment details (e.g., Android version, device model)."
          placeholder: "Relevant logs or links to related code/documentation..."
      validations:
          required: false
